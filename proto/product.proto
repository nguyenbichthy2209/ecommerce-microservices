syntax = "proto3";

package product;

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (ProductResponse);
  rpc GetProduct (ProductIdRequest) returns (ProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (ProductResponse);
  rpc DeleteProduct (ProductIdRequest) returns (DeleteProductResponse);
  rpc ReserveInventory (ReserveInventoryRequest) returns (InventoryReservationResponse);
  rpc ReleaseInventory (InventoryReservationRequest) returns (InventoryReservationResponse);
  rpc GetInventoryReservation (InventoryReservationRequest) returns (InventoryReservationResponse);
  rpc CommitInventory (InventoryReservationRequest) returns (InventoryReservationResponse);
  rpc Health (HealthRequest) returns (HealthResponse);
}

message ProductIdRequest {
  int32 pid = 1;
}

message CreateProductRequest {
  string pname = 1;
  string price = 2;
  int32 quantity = 3;
}

message UpdateProductRequest {
  int32 pid = 1;
  string pname = 2;
  string price = 3;
  int32 quantity = 4;
}

message ProductResponse {
  int32 pid = 1;
  string pname = 2;
  string price = 3;
  int32 quantity = 4;
}

message ListProductsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListProductsResponse {
  repeated ProductResponse items = 1;
}

message DeleteProductResponse {
  int32 pid = 1;
  string message = 2;
}
message InventoryItemRequest {
  int32 pid = 1;
  int32 qty = 2;
}

message ReserveInventoryRequest {
  string reservation_key = 1;
  repeated InventoryItemRequest items = 2;
}

message InventoryReservationRequest {
  string reservation_key = 1;
}

message ReservedInventoryItem {
  int32 pid = 1;
  int32 qty = 2;
  string unit_price = 3;
}

message InventoryReservationResponse {
  string reservation_key = 1;
  string status = 2;
  repeated ReservedInventoryItem items = 3;
}
message HealthRequest {}

message HealthResponse {
  string status = 1;
}